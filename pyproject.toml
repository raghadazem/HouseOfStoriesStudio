[project]
name = "house-of-stories-studio"
version = "0.1.0"
description = "Desktop production-management tool for House of Stories (بيت الحكايات), an Arabic children's YouTube studio."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

# Core dependencies used by app/core once Milestones 2-3 land.
# Milestone 1 code (app/config.py, app/logging_setup.py) uses only the
# standard library and does not require any of these to be installed.
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pillow>=10.2",
    "python-bidi>=0.4",
    "arabic-reshaper>=3.0",
    "google-genai>=1.0",
    "elevenlabs>=1.0",
    "tinytag>=1.9",
]

[project.scripts]
hos-cli = "app.cli.main:main"
hos-gui = "app.gui.app:main"

[project.optional-dependencies]
# Only needed starting Milestone 4 (GUI). Kept separate so Milestones
# 1-3 never require installing the large PySide6 package.
gui = [
    "pyside6>=6.6",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-qt>=4.4",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
qt_api = "pyside6"

[tool.ruff]
line-length = 100
target-version = "py312"
# Alembic-generated revision scripts follow Alembic's own template/style,
# not this project's — lint the handwritten alembic/env.py, but not
# machine-generated migrations.
extend-exclude = ["alembic/versions"]
