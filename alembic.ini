[alembic]
script_location = alembic
prepend_sys_path = .

# Placeholder only — app/core/db/engine.py's db_path (driven by
# AppConfig / HOS_DATA_DIR) is what actually gets used. alembic/env.py
# overwrites this value at runtime before any migration reads it, so
# `alembic` on the command line always operates on this project's real
# database rather than requiring this file to be hand-edited per machine.
sqlalchemy.url = sqlite:///data/studio.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
